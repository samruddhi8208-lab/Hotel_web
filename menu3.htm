<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hotel Menu Card</title>

<style>

body{
    margin:0;
    padding:0;
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

/* Header */
.header{
    background:#2c3e50;
    color:white;
    padding:20px;
    text-align:center;
}

/* Menu Container */
.menu-container{
    width:80%;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

/* Menu Section */
.menu-section{
    margin-bottom:30px;
}

.menu-section h2{
    background:#e67e22;
    color:white;
    padding:10px;
    border-radius:5px;
}

/* Menu List */
.menu-list{
    list-style:none;
    padding:0;
    margin-top:10px;
}

.menu-list li{
    display:flex;
    justify-content:space-between;
    padding:12px;
    border-bottom:1px dashed #ccc;
    font-size:16px;
}

.menu-list li:last-child{
    border-bottom:none;
}

.price{
    color:#27ae60;
    font-weight:bold;
}

/* Footer */
.footer{
    text-align:center;
    background:#2c3e50;
    color:white;
    padding:15px;
    margin-top:30px;
}

</style>
</head>

<body>

<!-- Header -->
<div class="header">
    <h1>Royal Stay HotelMenu Card</h1>
    <p>Delicious Food & Best Quality</p>
</div>

<!-- Menu Container -->
<div class="menu-container">

    <!-- Starter Section -->
    <div class="menu-section">
        <h2>Starters</h2>
        <ul class="menu-list">
            <li>fermented idli   <span class="price">₹120</span></li>
            <li>dosas  <span class="price">₹80</span></li>
                        <li>chicken roll <span class="price">₹100</span></li>
        </ul>
    </div>

    <!-- Main Course Section -->
    <div class="menu-section">
        <h2>Main Course</h2>
        <ul class="menu-list">
        <li> Nonveg thali</li>
            <li>vada (savory donuts) <span class="price">₹150</span></li>
            <li>sambar (spiced lentil stew) <span class="price">₹90</span></li>
            <li>rice-based dishes <span class="price">₹200</span></li>
                    </ul>
    </div>

  
<!-- Footer -->
<div class="footer">
    <p>© Royal Stay Hotel | All Rights Reserved</p>
</div>

</body>
</html>
